<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tabless</title>
<style>
  :root{
    --accent:#8ea3c4;
    --bg:#0e1116; --panel:#151922; --panel-2:#1b212c;
    --line:#242b38; --text:#dde3ec; --dim:#8b95a6; --dimmer:#5d6675;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    display:flex;flex-direction:column;background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,"Segoe UI","PingFang SC","Hiragino Sans GB","Source Han Sans SC",sans-serif;
    overflow:hidden;
  }
  /* Scrollbars match the ones injected into every document (server.py,
     SCROLLBAR_CSS), so the sidebar and the document don't scroll in two
     visibly different styles. */
  ::-webkit-scrollbar{width:12px;height:12px;background:transparent}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#ffffff1f;border:3px solid transparent;
    border-radius:10px;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#ffffff36;border-width:2px;
    background-clip:padding-box}
  ::-webkit-scrollbar-thumb:active{background:#ffffff4d;border-width:2px;
    background-clip:padding-box}
  ::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-button{display:none;width:0;height:0}

  #bar{height:3px;background:var(--accent);flex:none;transition:background .18s}

  /* ---------- project tabs ---------- */
  #tabs{
    flex:none;display:flex;align-items:stretch;gap:1px;overflow-x:auto;
    background:var(--panel);border-bottom:1px solid var(--line);
    scrollbar-width:thin;
  }
  #tabs::-webkit-scrollbar{height:0}
  .tab{
    display:flex;align-items:center;gap:7px;padding:0 15px;height:38px;
    cursor:pointer;white-space:nowrap;color:var(--dim);font-size:13px;
    border-bottom:2px solid transparent;flex:none;
  }
  .tab:hover{background:var(--panel-2);color:var(--text)}
  .tab.on{color:var(--text);background:var(--panel-2);font-weight:500}
  .tab .pd{width:8px;height:8px;border-radius:2px;flex:none}
  .tab .n{font-size:11px;color:var(--dimmer);
    padding:0 5px;border-radius:9px;background:#ffffff0d;min-width:17px;text-align:center}
  .tab .n.has{color:#0b0d12;font-weight:600}
  .tab.pulse{animation:pulse 1.5s ease-out 2}
  @keyframes pulse{0%,100%{background:transparent}30%{background:#ffffff14}}

  #main{flex:1;display:flex;min-height:0}

  /* ---------- document list ---------- */
  #side{
    width:290px;flex:none;display:flex;flex-direction:column;
    background:var(--panel);border-right:1px solid var(--line);
  }
  #head{padding:10px 14px;border-bottom:1px solid var(--line)}
  #q{
    width:100%;padding:7px 10px;border-radius:7px;
    border:1px solid var(--line);background:var(--bg);color:var(--text);
    font:inherit;font-size:13px;outline:none;
  }
  #q:focus{border-color:var(--accent)}
  #meta{margin-top:7px;font-size:11px;color:var(--dimmer)}

  #list{flex:1;overflow-y:auto;padding:5px 0}
  .doc{
    padding:9px 15px;cursor:pointer;border-left:3px solid transparent;
    display:flex;flex-direction:column;gap:3px;position:relative;
  }
  .doc:hover{background:var(--panel-2)}
  .doc.on{background:var(--panel-2);border-left-color:var(--accent)}
  .doc.fresh{animation:flash 1.8s ease-out}
  @keyframes flash{
    0%,22%{background:color-mix(in srgb,var(--accent) 32%,var(--panel))}
    100%{background:transparent}
  }
  .t{font-size:13.5px;line-height:1.4;display:flex;align-items:baseline;gap:6px;
    padding-right:22px}
  .t .unread{width:6px;height:6px;border-radius:50%;background:var(--accent);
    flex:none;transform:translateY(-1px)}
  .doc.read .t{color:var(--dim)}
  .doc.read .t .unread{display:none}
  .sub{font-size:11.5px;color:var(--dimmer);display:flex;gap:6px;align-items:center;
    flex-wrap:wrap}
  .tag{padding:0 5px;border-radius:4px;background:var(--panel-2);
    border:1px solid var(--line);font-size:10.5px;color:var(--dim)}
  .tag.live{color:#2dd4bf;border-color:#2dd4bf44;background:#2dd4bf14}
  .tag.site{color:#fbbf24;border-color:#fbbf2444;background:#fbbf2414}
  .pd{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}
  #none{padding:26px 16px;color:var(--dimmer);font-size:12.5px;text-align:center}

  /* ---------- type groups ----------
     Types are an open set -- anything is allowed to invent one -- so nothing
     here may key off a specific type name. There is exactly one visual level,
     "a group". An unknown icon falls back to a generic one; an unrecognised
     type must never render the whole group as broken. */
  .grp{
    display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
    padding:9px 15px 5px;font-size:11px;letter-spacing:.06em;color:var(--dimmer);
    text-transform:uppercase;position:sticky;top:0;background:var(--panel);z-index:1;
  }
  .grp:hover{color:var(--dim)}
  .grp .caret{font-size:9px;transition:transform .15s;opacity:.7}
  .grp.closed .caret{transform:rotate(-90deg)}
  .grp .gname{font-weight:600}
  .grp .gcount{margin-left:auto;font-variant-numeric:tabular-nums;opacity:.75}
  .grp .gdot{width:5px;height:5px;border-radius:50%;background:var(--accent);
    flex:none;opacity:0;transition:opacity .15s}
  .grp.hasunread .gdot{opacity:1}
  .gbody.closed{display:none}

  /* Starred group -- pinned across types. A starred entry is lifted out of its
     type group rather than shown in both: the same thing appearing twice in one
     list is more confusing than it is convenient. */
  .grp.star{color:var(--accent)}
  .grp.star .gname{letter-spacing:.04em}
  .starbar{height:1px;background:var(--line);margin:7px 15px 0}

  /* The star sits in the corner of a row, near-invisible until hover. A
     permanent column of grey stars turns the list into noise, and this list
     exists to be scanned. */
  .star-btn{
    position:absolute;top:7px;right:9px;width:22px;height:22px;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:none;border:none;border-radius:5px;cursor:pointer;
    color:var(--dimmer);font-size:13px;line-height:1;opacity:0;
    transition:opacity .12s,color .12s,background .12s;
  }
  .doc:hover .star-btn{opacity:.55}
  .star-btn:hover{opacity:1!important;color:var(--accent);background:var(--panel-2)}
  .star-btn.on{opacity:1;color:var(--accent)}

  /* ---------- reading pane ---------- */
  #view{flex:1;min-width:0;position:relative;background:#0b0d12;
    display:flex;flex-direction:column}
  #docbar{
    flex:none;display:flex;align-items:center;gap:9px;height:32px;
    padding:0 8px 0 13px;background:var(--panel);border-bottom:1px solid var(--line);
    font-size:12.5px;color:var(--dim);
  }
  #docbar.hide{display:none}
  #dtitle{color:var(--text);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;min-width:0}
  #dmeta{flex:none;font-size:11.5px;color:var(--dimmer);white-space:nowrap}
  #acts{flex:none;margin-left:auto;display:flex;gap:6px}
  .act{
    padding:3px 10px;border-radius:6px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--dim);font:inherit;font-size:11.5px;
    cursor:pointer;white-space:nowrap;transition:color .12s,border-color .12s;
  }
  .act:hover{color:var(--text);border-color:var(--accent)}
  .act.ok{color:#34d399;border-color:#34d39966}
  .act.bad{color:#f87171;border-color:#f8717166}
  .act.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  iframe{flex:1;width:100%;min-height:0;border:0;display:block;background:#fff}
  #empty{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;color:var(--dimmer)}
  #empty .big{font-size:30px;opacity:.35}
  kbd{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;font-size:11px;font-family:inherit;color:var(--dim)}
</style>
</head>
<body>
<div id="bar"></div>
<nav id="tabs"></nav>
<div id="main">
  <aside id="side">
    <div id="head">
      <input id="q" autocomplete="off">
      <div id="meta"></div>
    </div>
    <div id="list"></div>
  </aside>
  <section id="view">
    <div id="docbar" class="hide">
      <span class="pd" id="dpd"></span>
      <span id="dtitle"></span>
      <span id="dmeta"></span>
      <span id="acts">
        <button class="act" id="star"></button>
        <button class="act" id="copy"></button>
      </span>
    </div>
    <iframe id="frame"></iframe>
    <div id="empty">
      <div class="big">▤</div>
      <div id="emptymsg"></div>
      <div style="font-size:12px" id="emptykeys"></div>
    </div>
  </section>
</div>

<script>
/* Strings arrive from the server, which reads the same locales/*.json the CLI
   uses -- that shared file is what stops the two halves of the product from
   describing the same concept in two different ways. Opening this file directly
   (no server) shows raw keys, which is the intended tell that it is being run
   the wrong way. */
const I18N = window.__TABLESS_I18N__ || {};
function T(key, vars){
  let s = I18N[key] !== undefined ? I18N[key] : key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

const ALL = '\0';                       // internal id of the "All" tab
const $ = id => document.getElementById(id);

let docs = [], shown = [], projects = [];
let tab = new URLSearchParams(location.search).get('p') || ALL;
let current = null;
let lastSeen = {};                      // per tab: what you were reading, restored on return

const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const pname = p => p === ALL ? T('ui.all') : p === '_inbox' ? T('ui.inbox') : p;
const pcolor = p => p === ALL ? '#8ea3c4'
  : (projects.find(x => x.name === p) || {}).color || '#8ea3c4';

/* ---------- favicon: project colour plus an unread dot ---------- */
function setFavicon(color, label, badge){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = color;
  x.beginPath(); x.roundRect(3, 3, 58, 58, 15); x.fill();
  x.fillStyle = '#0b0d12';
  x.font = '600 34px system-ui, sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(label, 32, 35);
  if (badge){
    x.fillStyle = '#f87171';
    x.beginPath(); x.arc(51, 13, 12, 0, 7); x.fill();
    x.strokeStyle = '#0b0d12'; x.lineWidth = 3; x.stroke();
  }
  let link = document.querySelector('link[rel="icon"]');
  if (!link){ link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
  link.href = c.toDataURL();
}

function refreshChrome(){
  const unread = docs.filter(d => d.unread).length;
  const color = pcolor(tab);
  document.documentElement.style.setProperty('--accent', color);
  const raw = pname(tab).replace(/[^一-龥a-zA-Z0-9]/g, '');
  setFavicon(color, (raw[0] || 'T').toUpperCase(), unread > 0);
  document.title = (unread ? `(${unread}) ` : '')
                 + (current ? `${current.title} — ` : '') + T('ui.title');
}

/* ---------- tab strip ---------- */
function renderTabs(){
  const box = $('tabs');
  box.innerHTML = '';
  const items = [{ name: ALL }, ...projects];
  for (const p of items){
    const list = p.name === ALL ? docs : docs.filter(d => d.project === p.name);
    if (p.name !== ALL && !list.length) continue;
    const unread = list.filter(d => d.unread).length;
    const el = document.createElement('div');
    el.className = 'tab' + (p.name === tab ? ' on' : '');
    el.dataset.p = p.name;
    const color = pcolor(p.name);
    el.innerHTML =
      `<span class="pd" style="background:${color}"></span>
       <span>${esc(pname(p.name))}</span>
       <span class="n ${unread ? 'has' : ''}"
             style="${unread ? `background:${color}` : ''}">${unread || list.length}</span>`;
    el.onclick = () => switchTo(p.name);
    if (p.name === tab) el.style.borderBottomColor = color;
    box.appendChild(el);
  }
}

function switchTo(p, docId){
  if (p !== tab){
    if (current) lastSeen[tab] = current.id;      // remember where this tab was
    tab = p;
    current = null;
    $('q').value = '';
  }
  renderTabs();
  render();
  const want = docId ? docs.find(d => d.id === docId)
                     : shown.find(d => d.id === lastSeen[p]);
  if (want) openDoc(want);
  else if (shown.length) openDoc(shown[0]);
  else {
    current = null;
    $('frame').src = 'about:blank';
    $('empty').style.display = 'flex';
    renderBar();
  }
  const el = document.querySelector(`.tab[data-p="${CSS.escape(p)}"]`);
  if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

/* ---------- document list ---------- */
const fmt = iso => {
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString())
    return T('ui.today') + ' ' + d.toTimeString().slice(0, 5);
  if (d.toDateString() === new Date(now - 864e5).toDateString())
    return T('ui.yesterday') + ' ' + d.toTimeString().slice(0, 5);
  return T('ui.date', { month: d.getMonth() + 1, day: d.getDate() });
};
const sourceLabel = s =>
  !s || s === 'agent' ? ''
    : s.startsWith('wechat:') ? T('ui.source_wechat', { name: s.slice(7) }) : s;

function sortDocs(a, b){
  if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
  return a.updated_at < b.updated_at ? 1 : -1;
}

/* Type labels and icons are decoration only. Types are an open set: an unknown
   one falls back to its raw name and a generic icon. Rendering a group as
   broken because nobody predicted its name is not an option. */
const STAR = '__starred__';        // key of the pseudo-group for starred entries
const TYPE_ICON = { report:'▤', prototype:'◈', doc:'▣', eval:'◇' };
const tlabel = ty => T('type.' + ty) === 'type.' + ty ? ty : T('type.' + ty);
const ticon  = ty => TYPE_ICON[ty] || '▢';

/* Collapsed state is per type (consistent across projects) and survives reload. */
let collapsed = new Set();
try { collapsed = new Set(JSON.parse(localStorage.getItem('tabless.collapsed') || '[]')); } catch {}
const saveCollapsed = () =>
  localStorage.setItem('tabless.collapsed', JSON.stringify([...collapsed]));

/* Starring is pinning across types. It reuses the existing `pinned` field the
   back end already understands rather than adding a parallel concept. */
function toggleStar(d){
  d.pinned = !d.pinned;
  fetch('/api/doc/' + d.id, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pinned: d.pinned })
  }).catch(() => {});
  render();          // optimistic: a star is only sort order, and a failed request self-corrects
  if (current && current.id === d.id) renderBar();
}

function docEl(d){
  const el = document.createElement('div');
  el.className = 'doc' + (d.unread ? '' : ' read') + (current && d.id === current.id ? ' on' : '');
  el.dataset.id = d.id;
  const src = sourceLabel(d.source);
  const badge = tab !== ALL ? '' :
    `<span class="pd" style="background:${pcolor(d.project)}"></span>
     <span>${esc(pname(d.project))}</span>`;
  const kind = d.kind === 'live' ? `<span class="tag live">${esc(T('ui.tag_live'))}</span>`
    : d.kind === 'site' ? `<span class="tag site">${esc(T('ui.tag_site', { count: d.assets }))}</span>` : '';
  /* Inside the starred group the type still needs saying (the group name no
     longer says it); inside a type group it does not. */
  const tt = `<span class="tag">${ticon(d.type)} ${esc(tlabel(d.type))}</span>`;
  el.innerHTML =
    `<div class="t"><span class="unread"></span><span>${esc(d.title)}</span></div>
     <div class="sub">
       ${badge}<span>${fmt(d.updated_at)}</span>${kind}
       ${d.pinned ? tt : ''}
       ${d.version > 1 ? `<span class="tag">v${d.version}</span>` : ''}
       ${src ? `<span class="tag">${esc(src)}</span>` : ''}
     </div>
     <button class="star-btn${d.pinned ? ' on' : ''}"
             title="${esc(d.pinned ? T('ui.unstar_title') : T('ui.star_title'))}"
             >${d.pinned ? '★' : '☆'}</button>`;
  el.onclick = () => openDoc(d);
  el.querySelector('.star-btn').onclick = ev => {
    ev.stopPropagation();          // don't let the click fall through to "open this"
    toggleStar(d);
  };
  return el;
}

function render(){
  const kw = $('q').value.trim().toLowerCase();
  const hits = docs
    .filter(d => tab === ALL || d.project === tab)
    .filter(d => !kw || d.title.toLowerCase().includes(kw))
    .sort(sortDocs);

  /* Starred entries are lifted into their own group first. Pinning only means
     something if it crosses types -- otherwise "pinned" just means first within
     a group you still have to remember the name of. Lifted, not duplicated. */
  const starred = hits.filter(d => d.pinned);
  const rest = hits.filter(d => !d.pinned);

  /* Group order is not hard-coded: groups sort by their newest document, so
     whatever you are working on floats up and a brand-new type needs no
     registration anywhere in this file. */
  const groups = new Map();
  for (const d of rest){
    const ty = d.type || 'report';
    if (!groups.has(ty)) groups.set(ty, []);
    groups.get(ty).push(d);
  }
  const order = [...groups.entries()]
    .sort((a, b) => (a[1][0].updated_at < b[1][0].updated_at ? 1 : -1));
  /* STAR cannot collide with a real type name: normalize_type turns _ into -. */
  if (starred.length) order.unshift([STAR, starred]);

  const list = $('list');
  list.innerHTML = '';
  shown = [];
  if (!hits.length){
    list.innerHTML = `<div id="none">${esc(kw ? T('ui.no_match') : T('ui.no_docs'))}</div>`;
  }

  /* Searching force-expands every group: a hit hidden inside a collapsed group
     is indistinguishable from no hit at all. */
  const searching = !!kw;
  for (const [ty, items] of order){
    const isStar = ty === STAR;
    const shut = !searching && collapsed.has(ty);
    const unread = items.filter(d => d.unread).length;

    const head = document.createElement('div');
    head.className = 'grp' + (shut ? ' closed' : '') + (unread ? ' hasunread' : '')
      + (isStar ? ' star' : '');
    head.innerHTML =
      `<span class="caret">▼</span><span>${isStar ? '★' : ticon(ty)}</span>
       <span class="gname">${esc(isStar ? T('ui.starred_group') : tlabel(ty))}</span>
       <span class="gdot"></span><span class="gcount">${items.length}</span>`;
    head.onclick = () => {
      if (collapsed.has(ty)) collapsed.delete(ty); else collapsed.add(ty);
      saveCollapsed();
      render();
    };
    list.appendChild(head);

    const body = document.createElement('div');
    body.className = 'gbody' + (shut ? ' closed' : '');
    for (const d of items) body.appendChild(docEl(d));
    list.appendChild(body);
    if (isStar && !shut){                    // a rule between starred and the types
      const hr = document.createElement('div');
      hr.className = 'starbar';
      list.appendChild(hr);
    }
    /* Entries in a collapsed group stay out of `shown`, or j/k would jump to
       something you cannot see. */
    if (!shut) shown.push(...items);
  }

  const unread = hits.filter(d => d.unread).length;
  const hidden = hits.length - shown.length;
  $('meta').textContent = T('ui.count_docs', { count: hits.length })
    + (unread ? ` · ${T('ui.count_unread', { count: unread })}` : '')
    + (hidden ? ` · ${T('ui.count_collapsed', { count: hidden })}` : '');
  refreshChrome();
}

/* ---------- document bar, and the copy-path button ----------
   The iframe shows /doc/<id>; where that document actually lives on disk is
   invisible from here. This button exists for one purpose: handing the report
   to an agent. Copy, paste, done. */
function renderBar(){
  const bar = $('docbar');
  if (!current){ bar.classList.add('hide'); return; }
  bar.classList.remove('hide');
  $('dpd').style.background = pcolor(current.project);
  $('dtitle').textContent = current.title;
  const sb = $('star');
  sb.textContent = current.pinned ? T('ui.starred') : T('ui.star');
  sb.title = current.pinned ? T('ui.unstar_title') : T('ui.star_title');
  sb.classList.toggle('on', !!current.pinned);
  $('dmeta').textContent = [
    pname(current.project),
    `${ticon(current.type)} ${tlabel(current.type)}`,
    fmt(current.updated_at),
    current.version > 1 ? `v${current.version}` : '',
    current.kind === 'site' ? T('ui.kind_site')
      : current.kind === 'live' ? T('ui.kind_live') : '',
  ].filter(Boolean).join(' · ');
  $('copy').title = current.path || T('ui.no_disk_path');
  resetCopy();
}

let copyTimer = null;
function resetCopy(){
  clearTimeout(copyTimer);
  const b = $('copy');
  b.textContent = T('ui.copy_path');
  b.classList.remove('ok', 'bad');
}
function flashCopy(text, ok){
  const b = $('copy');
  b.textContent = text;
  b.classList.toggle('ok', ok);
  b.classList.toggle('bad', !ok);
  clearTimeout(copyTimer);
  copyTimer = setTimeout(resetCopy, 1600);
}
function copyPath(){
  if (!current) return;
  const p = current.path || '';
  if (!p) return flashCopy(T('ui.no_path'), false);
  const fallback = () => {
    // Used when the clipboard API is refused: hidden textarea plus execCommand.
    const ta = document.createElement('textarea');
    ta.value = p; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    ta.remove();
    flashCopy(ok ? T('ui.copied') : T('ui.copy_failed'), ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(p).then(() => flashCopy(T('ui.copied'), true)).catch(fallback);
  else fallback();
}
$('copy').onclick = copyPath;
$('star').onclick = () => { if (current) toggleStar(current); };

function openDoc(d){
  current = d;
  /* Opening a document inside a collapsed group expands that group. Clicking
     one always came from an open group, so this is really for programmatic
     opens: a pushed report landing in a collapsed group would be invisible, and
     "a report arrived and the user never knew" is the worst failure here. */
  const grp = d.pinned ? STAR : d.type;
  if (grp && collapsed.has(grp)){
    collapsed.delete(grp);
    saveCollapsed();
  }
  lastSeen[tab] = d.id;
  $('frame').src = '/doc/' + d.id;
  $('empty').style.display = 'none';
  renderBar();
  if (d.unread){
    d.unread = false;
    fetch('/api/doc/' + d.id, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ unread: false })
    }).catch(() => {});
    renderTabs();
  }
  render();
  const el = document.querySelector(`.doc[data-id="${d.id}"]`);
  if (el) el.scrollIntoView({ block: 'nearest' });
}

/* ---------- data ---------- */
async function load(initial){
  const [docsRes, projRes] = await Promise.all([
    fetch('/api/docs').then(r => r.json()),
    fetch('/api/projects').then(r => r.json()),
  ]);
  docs = docsRes.docs || [];
  projects = projRes || [];
  /* `current` points into the old array; re-point it so its path and version
     don't stay frozen at the previous values. */
  if (current) current = docs.find(d => d.id === current.id) || current;
  if (tab !== ALL && !projects.some(p => p.name === tab)) tab = ALL;
  renderTabs();
  render();
  renderBar();
  if (!initial) return;
  /* Cold start pointed at a specific document (a report just pushed): jump
     straight to whichever tab holds it. */
  const wanted = new URLSearchParams(location.search).get('doc');
  const want = wanted && docs.find(d => d.id === wanted);
  if (want) switchTo(want.project, want.id);
  else if (shown.length) openDoc(shown[0]);
}

/* ---------- SSE: every project's updates arrive in this one window ---------- */
function connect(){
  const es = new EventSource('/events');
  es.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    /* Receipt. The server uses it to confirm this window is genuinely alive;
       without one it opens a new window rather than pushing a report into a
       connection that has already gone away. */
    if (msg.seq) fetch('/api/ack', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seq: msg.seq })
    }).catch(() => {});
    if (msg.type === 'doc'){
      const d = msg.doc;
      const i = docs.findIndex(x => x.id === d.id);
      if (i >= 0) docs[i] = d; else docs.push(d);
      /* The document being read was just replaced by a new version: follow it,
         so the bar and the path don't describe the old one. */
      if (current && current.id === d.id){ current = d; renderBar(); }
      if (!projects.some(p => p.name === d.project)) { load(); return; }
      renderTabs();
      if (tab === ALL || d.project === tab){
        const g = d.pinned ? STAR : d.type;
        if (g && collapsed.has(g)){ collapsed.delete(g); saveCollapsed(); }
        render();
        const el = document.querySelector(`.doc[data-id="${d.id}"]`);
        if (el){ el.classList.add('fresh'); el.scrollIntoView({ block: 'nearest' }); }
      } else {
        /* Not the current tab: light that tab up, don't take away what is
           being read. */
        const el = document.querySelector(`.tab[data-p="${CSS.escape(d.project)}"]`);
        if (el) el.classList.add('pulse');
        refreshChrome();
      }
    } else if (msg.type === 'goto'){
      switchTo(msg.project || ALL, msg.doc);
      document.body.animate([{ opacity: .6 }, { opacity: 1 }], { duration: 240, iterations: 2 });
    } else if (msg.type === 'reload'){
      location.reload();
    }
  };
  es.onerror = () => { es.close(); setTimeout(connect, 3000); };
}

/* ---------- keys ----------
   All of these share one limitation: once you click into the document on the
   right, the iframe swallows keyboard events and the shortcuts stop responding.
   Clicking the list brings them back. The buttons always work. */
function tabNames(){
  return [ALL, ...projects.filter(p => docs.some(d => d.project === p.name)).map(p => p.name)];
}

document.addEventListener('keydown', e => {
  if (e.target === $('q')){
    if (e.key === 'Escape'){ $('q').value = ''; render(); $('q').blur(); }
    return;
  }
  const i = shown.findIndex(d => current && d.id === current.id);
  const names = tabNames(), ti = names.indexOf(tab);
  if (e.key === 'j' && i < shown.length - 1) openDoc(shown[i + 1]);
  else if (e.key === 'k' && i > 0) openDoc(shown[i - 1]);
  else if (e.key === 'ArrowRight' && ti < names.length - 1) switchTo(names[ti + 1]);
  else if (e.key === 'ArrowLeft' && ti > 0) switchTo(names[ti - 1]);
  else if (e.key >= '1' && e.key <= '9' && names[+e.key - 1]) switchTo(names[+e.key - 1]);
  else if (e.key === '/'){ e.preventDefault(); $('q').focus(); }
  else if (e.key === 'c'){ copyPath(); }
  else if (e.key === 'p' && current) toggleStar(current);
});
$('q').addEventListener('input', render);

/* ---------- static labels ---------- */
$('q').placeholder = T('ui.search');
$('frame').title = T('ui.doc_frame');
$('emptymsg').textContent = T('ui.pick_doc');
$('emptykeys').innerHTML =
  `<kbd>j</kbd>/<kbd>k</kbd> ${esc(T('ui.keys_doc'))} · ` +
  `<kbd>←</kbd>/<kbd>→</kbd> ${esc(T('ui.keys_project'))} · ` +
  `<kbd>/</kbd> ${esc(T('ui.keys_search'))} · ` +
  `<kbd>p</kbd> ${esc(T('ui.keys_star'))} · ` +
  `<kbd>c</kbd> ${esc(T('ui.keys_copy'))}`;
resetCopy();

load(true);
connect();
setInterval(() => load(false), 60000);
</script>
