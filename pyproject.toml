[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabless"
version = "0.1.0"
description = "A local shelf and reader for the HTML your coding agent writes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yifan Huang" }]
keywords = [
    "html", "archive", "reader", "ai-agent", "claude-code",
    "artifacts", "reports", "local-first", "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
# No runtime dependencies. This is deliberate -- see CONTRIBUTING.md.
dependencies = []

[project.optional-dependencies]
# Only needed if you point `[sources] yaml` at an external YAML project table.
yaml = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/starless0912/tabless"
Repository = "https://github.com/starless0912/tabless"
Issues = "https://github.com/starless0912/tabless/issues"
Changelog = "https://github.com/starless0912/tabless/blob/main/CHANGELOG.md"

[project.scripts]
tabless = "tabless.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tabless = ["reader.html", "locales/*.json"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Broad excepts are load-bearing here: archiving must never fail because a
    # colour lookup, a locale probe or a browser launch had an opinion.
    "BLE001",
    # RUF001/003 flag full-width punctuation, which is correct in the zh strings.
    "RUF001", "RUF002", "RUF003",
    # `try/except/pass` keeps the comment explaining *why* a failure is
    # tolerable next to the failure. contextlib.suppress moves it to the header.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# Tests read better with a plain assert-style layout and long explanatory names.
"tests/*" = ["E501"]
