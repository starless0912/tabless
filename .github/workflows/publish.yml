# Publishes to PyPI when a version tag is pushed.
#
# Inert until PyPI trusted publishing is configured for this repository:
#   https://pypi.org/manage/account/publishing/
#   owner = <your github user>, repo = tabless,
#   workflow = publish.yml, environment = pypi
#
# No API token is stored anywhere; the job authenticates with a short-lived
# OIDC identity issued to this workflow.

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
