name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Byte-compile
        run: python -m compileall -q src

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # The real thing, minus the browser: archive a mixed batch, confirm the
      # page/site/live split survives on this platform, and confirm the paths
      # tabless derives are the paths it actually wrote to.
      - name: End-to-end archive
        shell: bash
        env:
          TABLESS_HOME: ${{ runner.temp }}/tabless-ci
          PYTHONIOENCODING: utf-8
        run: |
          tabless --version
          tabless where
          tabless demo --no-open
          tabless list
          tabless types
          tabless projects
          python - <<'PY'
          import json, os, pathlib
          home = pathlib.Path(os.environ["TABLESS_HOME"])
          docs = json.loads((home / "_index" / "index.json").read_text(encoding="utf-8"))
          kinds = sorted({d["kind"] for d in docs})
          assert kinds == ["live", "page", "site"], kinds
          for d in docs:
              if d["kind"] == "live":
                  continue
              target = home / d["file"]
              assert target.exists(), f"missing on disk: {d['file']}"
              if d["kind"] == "site":
                  assert (target / d["entry"]).is_file(), d["entry"]
          print(f"ok: {len(docs)} documents, kinds {kinds}")
          PY

      # Both language bundles have to survive a real run, not just a unit test.
      - name: Localised output
        shell: bash
        env:
          TABLESS_HOME: ${{ runner.temp }}/tabless-ci
          PYTHONIOENCODING: utf-8
        run: |
          TABLESS_LANG=en tabless types
          TABLESS_LANG=zh_CN tabless types

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # The reader and the language bundles are data files. If packaging drops
      # them the CLI still installs cleanly and then serves a blank window, so
      # check the wheel actually contains them.
      - name: Wheel contains its data files
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          for needed in ("tabless/reader.html", "tabless/locales/en.json",
                         "tabless/locales/zh.json"):
              assert needed in names, f"{needed} missing from {wheel.name}"
          print(f"ok: {wheel.name} carries the reader and both locales")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
